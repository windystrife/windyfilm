<!doctype html>
<html><head><meta charset="utf-8"><title>WindyFilm phone: develop, Glow tab, Halation (your film model)</title>
<link rel="stylesheet" href="wfm.css">
</head>
<body><div class="screen"></div>
<script src="dev.js"></script>
<script>
// Glow, Engine Lab: the picker shows one effect's rows (Halation here, Bloom in 04c, Mist as before); the dots say
// which effects are on. Presets load that gauge's halation. The picture is the phone preview's shader output for these
// settings (left: before); the values are illustrative.
wfDev({
  time: '14:41', title: 'F10 · ROLL 003', sub: 'IMG_6847.CR2 · Portra 400', bg: 'assets/lab/glow_gpu.png', pos: 'center 35%', imgH: 200,
  img: split('assets/f/033_6847.jpg', 150, 'BEFORE', 'HALATION', 'center 35%'), chip: false, tab: 'Glow',
  panel:
    eng() +
    `<div style="margin-top:4px">${pk([['Halation', true], ['Bloom', true], ['Mist', false]], 'Halation')}</div>` +
    gh('Halation', `<span style="display:flex;gap:8px;align-items:center"><span class="chip ol" style="height:20px">Effect alone</span><i class="sw on"></i></span>`, 'new') +
    rw('Preset', seg(['8 mm', '16 mm', '35 mm', '65 mm'], '35 mm'), 'new') +
    sl('Amount', 75, 0, 100, '75', 'new') +
    sl('Hue', 45, 0, 100, 'red 45', 'new hue') +
    sl('Source gamma', 70, 0, 100, '70', 'new') +
    sl('Tight spread', 20, 0, 100, '20', 'new') +
    sl('Wide spread', 35, 0, 100, '35', 'new') +
    sl('Threshold', 75, 0, 100, '75', 'new') +
    sl2('Light band', 15, 80, 0, 100, '15–80', 'new') +
    sl('Blue cut', 80, 0, 100, '80', 'new') +
    sl('Feather', 50, 0, 100, '50', 'new') +
    '<div class="foot">Live preview is close; the saved print is made by the core</div>'
});
</script>
</body></html>
