<!doctype html>
<html><head><meta charset="utf-8"><title>WindyFilm foldable: viewfinder on the cover screen (Galaxy Z Fold3, folded)</title>
<meta name="wf-size" content="317x864">
<link rel="stylesheet" href="wfm.css">
<style>
.top { position: absolute; left: 0; top: 24px; width: 360px; height: 52px; padding: 6px 14px 0; }
.top .r1 { display: flex; justify-content: space-between; align-items: center; height: 22px; }
.top .roll { font-size: 12px; font-weight: 700; letter-spacing: .1em; }
.top .roll em { font-style: normal; color: var(--t2); font-weight: 500; letter-spacing: .02em; margin-left: 6px; }
.top .r2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.top .cnt { font-size: 12px; font-weight: 700; color: var(--amber); }
.vf { position: absolute; left: 0; top: 76px; width: 360px; height: 480px; background: url(assets/vf.jpg) center/cover; }
.vf .grid { position: absolute; inset: 0; background:
   linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.22) 33.2%, rgba(255,255,255,.22) 33.5%, transparent 33.5%,
     transparent 66.5%, rgba(255,255,255,.22) 66.5%, rgba(255,255,255,.22) 66.8%, transparent 66.8%),
   linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.22) 33.2%, rgba(255,255,255,.22) 33.4%, transparent 33.4%,
     transparent 66.6%, rgba(255,255,255,.22) 66.6%, rgba(255,255,255,.22) 66.8%, transparent 66.8%); }
.vf .live { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
.vf .live .chip { background: rgba(13,14,17,.72); }
.vf .live .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--green); }
.vf .hist { position: absolute; right: 10px; top: 10px; width: 74px; height: 38px; background: rgba(13,14,17,.62); border-radius: 6px; padding: 4px; }
.vf .af { position: absolute; left: 150px; top: 182px; width: 68px; height: 74px; border: 1.5px solid var(--amber); border-radius: 4px; }
.vf .af::after { content: "Face"; position: absolute; left: -1px; top: -16px; font-size: 9.5px; font-weight: 700; color: #1A1206; background: var(--amber); padding: 0 4px; border-radius: 2px; }
.vf .ladder { position: absolute; right: 8px; top: 150px; width: 22px; height: 180px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
.vf .ladder i { display: block; height: 1.5px; background: rgba(236,238,240,.8); width: 8px; }
.vf .ladder i.m { width: 14px; }
.vf .ladder i.c { background: var(--amber); width: 18px; height: 2.5px; }
.vf .ladder span { position: absolute; right: 22px; font-size: 9px; font-weight: 700; color: var(--t1); text-shadow: 0 0 3px #000; }
.vf .lens { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(13,14,17,.55); padding: 3px; border-radius: 16px; }
.vf .lens span { width: 30px; height: 26px; border-radius: 13px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--t1); }
.vf .lens span.on { background: rgba(244,166,52,.95); color: #1A1206; width: 36px; }
.vf .lens span.na { color: var(--t3); }
.vf .frameno { position: absolute; left: 10px; bottom: 14px; font-size: 10px; font-weight: 700; color: var(--t1); background: rgba(13,14,17,.6); border-radius: 4px; padding: 2px 6px; }
.man { position: absolute; left: 0; top: 556px; width: 360px; height: 48px; display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.man div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.man b { font-size: 9px; font-weight: 700; color: var(--t3); letter-spacing: .12em; }
.man span { font-size: 13.5px; font-weight: 600; }
.man .on b { color: var(--amber); } .man .on span { color: var(--amber); }
.man .on { background: linear-gradient(to top, var(--amber) 0 2px, transparent 2px); }
.dial { position: absolute; left: 0; top: 605px; width: 360px; height: 38px; overflow: hidden; }
.dial .ticks { position: absolute; left: 0; right: 0; top: 4px; height: 14px; background: repeating-linear-gradient(to right, #4A515C 0 1px, transparent 1px 9px); }
.dial .lab { position: absolute; top: 20px; font-size: 10px; color: var(--t3); font-weight: 600; transform: translateX(-50%); }
.dial .lab.c { color: var(--amber); font-weight: 800; font-size: 11px; }
.dial .needle { position: absolute; left: 180px; top: 0; width: 2px; height: 20px; background: var(--amber); margin-left: -1px; }
.dial .auto { position: absolute; right: 10px; top: 13px; }
.fx { position: absolute; left: 0; top: 646px; width: 360px; height: 30px; display: flex; gap: 6px; padding: 0 12px; overflow: hidden; }
.fx .chip { background: var(--s2); border: 1px solid var(--line); height: 26px; border-radius: 13px; font-size: 11px; }
.fx .chip b { color: var(--t3); font-weight: 600; margin-right: 2px; }
.bot { position: absolute; left: 0; top: 684px; width: 360px; height: 100px; }
.modes { position: absolute; left: 0; top: 0; width: 360px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--t3); }
.modes span { margin: 0 10px; } .modes .on { color: var(--amber); }
.shut { position: absolute; left: 144px; top: 24px; width: 72px; height: 72px; border-radius: 36px; border: 4px solid var(--amber); display: flex; align-items: center; justify-content: center; }
.shut::after { content: ""; width: 56px; height: 56px; border-radius: 28px; background: var(--t1); }
.can { position: absolute; left: 22px; top: 22px; width: 76px; text-align: center; }
.can img { height: 62px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.can div { font-size: 10px; font-weight: 600; color: var(--t2); margin-top: 1px; }
.last { position: absolute; right: 26px; top: 32px; width: 56px; height: 56px; border-radius: 10px; background: #0A0A0B; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.last b { font-size: 16px; color: var(--t2); font-weight: 700; }
.last span { font-size: 8.5px; color: var(--t3); font-weight: 700; letter-spacing: .1em; }
.last::before { content: ""; position: absolute; left: 4px; right: 4px; top: 3px; height: 3px; background: repeating-linear-gradient(to right, #2C3038 0 4px, transparent 4px 7px); }
.last::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 3px; height: 3px; background: repeating-linear-gradient(to right, #2C3038 0 4px, transparent 4px 7px); }
/* Fold3 cover screen: 832 x 2268 px = 317 x 864 dp (compact). Mock 01's layout, narrower and taller: the viewfinder
   is 2:3 (a 3:2 sensor held upright), the rest moves down; nothing else changes. */
html, body, .screen { width: 317px; height: 864px; }
.status, .gesture, .top, .man, .dial, .fx, .bot, .modes { width: 317px; }
.vf { width: 317px; height: 476px; }
.vf .af { left: 132px; top: 196px; }
.vf .ladder { top: 170px; }
.man { top: 556px; } .dial { top: 606px; } .fx { top: 650px; } .bot { top: 716px; }
.shut { left: 122px; } .can { left: 12px; } .last { right: 18px; }
.dial .needle { left: 158px; }
.top .r1 .chip.ol { display: none; }
.cover { position: absolute; left: 10px; top: 466px; transform: translateY(-100%); }
</style></head>
<body><div class="screen">
<div class="status"><span>14:32</span><div class="icons"><i class="wifi"></i><i class="sig"></i><i class="bat"></i></div></div>

<div class="top">
  <div class="r1">
    <div class="roll">ROLL 004<em>Portra 400 · Scan</em></div>
    <div style="display:flex;gap:6px;align-items:center">
      <span class="chip ol">Blind</span>
      <span class="chip">DNG + JPG</span>
      <span class="ico" style="width:24px;height:24px"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>
    </div>
  </div>
  <div class="r2">
    <div class="gauge" id="g"></div>
    <div class="cnt">12 / 36</div>
  </div>
</div>

<div class="vf">
  <div class="grid"></div>
  <div class="live"><span class="chip"><i class="dot"></i>LIVE · full look</span></div>
  <div class="hist"><svg viewBox="0 0 66 30" width="66" height="30">
    <path d="M0 30 L0 27 C6 25 8 18 12 17 C17 16 19 9 24 8 C29 7 31 14 36 15 C41 16 44 6 49 7 C54 8 57 19 61 24 L64 22 L66 30 Z" fill="rgba(236,238,240,.55)"/>
    <path d="M0 30 L0 28 C7 27 10 22 15 20 C20 18 25 12 30 13 C35 14 40 20 46 18 C52 16 56 25 62 27 L66 30 Z" fill="rgba(244,166,52,.45)"/></svg></div>
  <div class="af"></div>
  <div class="ladder" id="lad"></div>
  <div class="frameno" style="bottom:auto;top:430px">F13</div>
  <div class="lens"><span class="na">.6</span><span class="on">1×</span><span>2</span><span>5</span></div>
</div>

<div class="man">
  <div class="on"><b>ISO</b><span>200</span></div>
  <div><b>SHUTTER</b><span>1/250</span></div>
  <div><b>WB</b><span>Day</span></div>
  <div><b>FOCUS</b><span>AF·F</span></div>
  <div><b>EV</b><span>+0.3</span></div>
</div>
<div class="dial" id="dial"><div class="ticks"></div><div class="needle"></div></div>

<div class="fx">
  <span class="chip"><b>Grain</b>Normal</span>
  <span class="chip"><b>Halation</b>Wide</span>
  <span class="chip"><b>Bloom</b>Low</span>
  <span class="chip"><b>Light</b>Day</span>
  <span class="chip"><b>Print</b>Scan</span>
  <span class="chip"><b>Strength</b>100%</span>
</div>

<div class="bot">
  <div class="modes"><span>FREE</span><span class="on">ROLL</span></div>
  <div class="can"><img src="assets/cans/PRT400.png"><div>Portra 400</div></div>
  <div class="shut"></div>
  <div class="last"><b>12</b><span>LATENT</span></div>
</div>
<div class="gesture"></div>
</div>
<script>
const g = document.getElementById('g');
for (let i = 1; i <= 36; i++) { const t = document.createElement('i'); if (i <= 12) t.className = 's'; if (i === 13) t.className = 'c'; if (i % 6 === 0 && i > 13) t.className = 'q'; g.appendChild(t); }
const lad = document.getElementById('lad');
for (let i = 0; i <= 12; i++) { const t = document.createElement('i'); if (i % 3 === 0) t.className = 'm'; if (i === 5) t.className = 'c'; lad.appendChild(t); }
[['+2', -4], ['0', 84], ['-2', 172]].forEach(([s, y]) => { const e = document.createElement('span'); e.textContent = s; e.style.top = y + 'px'; lad.appendChild(e); });
const dial = document.getElementById('dial');
const isos = ['25', '50', '100', '200', '400', '800', '1600', '3200'];
isos.forEach((s, i) => { const e = document.createElement('div'); e.className = 'lab' + (s === '200' ? ' c' : ''); e.textContent = s; e.style.left = (158 + (i - 3) * 54) + 'px'; dial.appendChild(e); });
</script>
</body></html>
